<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}body:not(.ready) #app{visibility:hidden}</style>
<title>排班 · Matrix DCL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working column — DCL + staff on top, a full-width timeline board (areas as swimlanes, 15:00 check-in rule), issues & share text below. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E8EBE4; --ink:#1C2520; --muted:#5C6961; --line:#D6DBD2;
  --accent:#2E5B45; --accent-ink:#FFFFFF; --checkin:#D4432A; --check:#2B79D3; --check-bg:#DDEBFB;
  --bad:#C0402B; --bad-bg:#FBE6E1; --warn:#9A6A12; --warn-bg:#F8EED6; --ok:#2E7D4F;
  --bar-ink:#1A1A1A; --task:#5E8A2E; --task-bg:#E6F0D8; --lane-out:#F5F9EF;
  --f-body:"Noto Sans TC","PingFang TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#19201B; --sunk:#141A16; --ink:#E4EAE4; --muted:#98A69C; --line:#2B352E;
  --accent:#86BB9C; --accent-ink:#0F1A13; --checkin:#FF6A4D; --check:#64A8F2; --check-bg:#16304A;
  --bad:#FF8A73; --bad-bg:#3A1D17; --warn:#E7B957; --warn-bg:#33290F; --ok:#7FCB9A; --task:#9CCB6A; --task-bg:#223018; --lane-out:#161D15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201B; --sunk:#141A16; --ink:#E4EAE4; --muted:#98A69C; --line:#2B352E;
  --accent:#86BB9C; --accent-ink:#0F1A13; --checkin:#FF6A4D; --check:#64A8F2; --check-bg:#16304A;
  --bad:#FF8A73; --bad-bg:#3A1D17; --warn:#E7B957; --warn-bg:#33290F; --ok:#7FCB9A; --task:#9CCB6A; --task-bg:#223018; --lane-out:#161D15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-size:24px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sync{font-size:12px;color:var(--muted)}
.sync b{font-weight:500}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:260px;flex:1;resize:vertical;font-family:var(--f-mono);font-size:12.5px;line-height:1.55}
input[type=number]{width:70px}
input[type=time]{width:122px;font-family:var(--f-mono);font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.04em;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:.04em}
.pill.pr{background:var(--bad-bg);color:var(--bad);cursor:pointer;border:1px solid transparent}
.pill.off{background:var(--sunk);color:var(--muted);cursor:pointer}
.pill.add{background:var(--check-bg);color:var(--check)}
.pill.unk{background:var(--warn-bg);color:var(--warn)}
.beds{color:var(--muted);font-size:12px}
.staffday{display:grid;gap:6px}
.sd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sd label{display:flex;align-items:center;gap:8px;min-width:120px;font-weight:500}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.totals{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.totals b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.totals .short b{color:var(--bad)}
/* board */
.boardbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.board{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);position:relative}
.board-inner{position:relative}
.ticks{position:sticky;top:0;height:30px;border-bottom:1px solid var(--line);background:var(--surface);z-index:3}
.tick{position:absolute;top:0;bottom:0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding:7px 0 0 4px;border-left:1px solid var(--line)}
.tick.half{border-left-style:dotted}
.tick.half span{display:none}
.checkin-flag{position:absolute;top:4px;transform:translateX(-50%);background:var(--checkin);color:#fff;font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;z-index:4}
.group{display:flex;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.glabel{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);font-family:var(--f-disp);font-size:15px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.glabel small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
.glabel.drop{background:var(--sunk)}
.gtrack{position:relative;flex:none}
.vline{position:absolute;top:0;bottom:0;border-left:1px dotted var(--line);pointer-events:none}
.vline.hour{border-left-style:solid;opacity:.6}
.vline.ci{border-left:2px solid var(--checkin);opacity:.85}
.bar{position:absolute;height:34px;border-radius:5px;padding:2px 14px 2px 8px;color:var(--bar-ink);cursor:grab;user-select:none;touch-action:none;overflow:hidden;display:flex;flex-direction:column;justify-content:center;line-height:1.2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bar .n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .r{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.bar.fixed{background:repeating-linear-gradient(135deg,var(--check-bg) 0 6px,transparent 6px 12px),var(--check-bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--check)}
.bar.sel{box-shadow:0 0 0 2px var(--ink),0 3px 10px rgba(0,0,0,.18);z-index:5}
.bar.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.bar.bad.sel{box-shadow:0 0 0 2px var(--bad),0 3px 10px rgba(0,0,0,.18)}
.bar .flag{position:absolute;top:2px;right:16px;font-size:10px;font-weight:700;color:var(--bad);background:#fff;border-radius:3px;padding:0 3px}
.bar .h{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize}
.bar .h::after{content:"";position:absolute;right:3px;top:9px;bottom:9px;border-left:2px solid rgba(0,0,0,.25)}
.bar.dragging{opacity:.85;cursor:grabbing;z-index:6}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
/* editor */
.editor{border:1px solid var(--ink);border-radius:10px;background:var(--surface);padding:14px 16px;display:grid;gap:10px}
.editor .fields{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.field{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.field>*{color:var(--ink);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* issues */
.issues{display:grid;gap:6px}
.issue{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 10px;border-radius:6px;cursor:default}
.issue.bad{background:var(--bad-bg);color:var(--bad)}
.issue.warn{background:var(--warn-bg);color:var(--warn)}
.issue.has{cursor:pointer}
.ok{color:var(--ok);font-size:13px}
pre.share{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border-radius:8px;padding:12px;margin:0;max-height:420px;overflow:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);padding:6px 10px;border-radius:6px;font-size:13px}
.notes{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.swatches{display:flex;gap:4px}
.swatch{width:18px;height:18px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.cl{display:grid;gap:8px;min-width:0}
.cl pre.share{max-height:none}
[hidden]{display:none!important}
.dedsel.on{border-color:var(--accent);color:var(--accent);font-weight:500}
select.tsel{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;width:auto;min-width:76px}
.bar.task{background:repeating-linear-gradient(135deg,var(--task-bg) 0 6px,transparent 6px 12px),var(--task-bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--task)}
.bar.task.sel{box-shadow:0 0 0 2px var(--ink),0 3px 10px rgba(0,0,0,.18)}
.group.rooms{border-bottom:1px dashed var(--line)}
.group.out .gtrack{background:var(--lane-out);cursor:copy}
.group.out .glabel{font-family:var(--f-body);font-size:12.5px;line-height:1.3;padding-block:4px;font-weight:500;color:var(--task);background:var(--lane-out)}
.group.out .glabel small{color:var(--muted);font-size:10.5px;line-height:1.25}
@media (min-width:600px){.group.out .glabel small{white-space:nowrap}}
.send-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.send-card{display:grid;gap:8px;align-content:start;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px}
.send-card pre.share{max-height:none}
.send-card textarea.extra{min-height:0;height:auto;flex:none;font-family:var(--f-body);font-size:13px;resize:vertical;border-style:dashed}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
@media (prefers-reduced-motion: no-preference){.bar{transition:box-shadow .12s}}
</style>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1>房務動線排班</h1><span class="sync" id="sync">載入中…</span></div>
    <div class="datebar">
      <button class="btn sm" id="prevDay" aria-label="前一天">‹</button>
      <input type="date" id="date">
      <button class="btn sm" id="nextDay" aria-label="後一天">›</button>
      <button class="btn sm" id="today">今天</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-plan" aria-selected="true">每日排班</button>
    <button class="tab" role="tab" id="tab-set" aria-selected="false">設定（房間・員工・規則）</button>
  </nav>

  <section id="view-plan" style="display:grid;gap:16px">
    <div class="grid2">
      <div class="panel" style="display:flex;flex-direction:column">
        <h2>貼上 DCL <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">每行一間房，例如 Villa F 7 (…) PR</span></h2>
        <textarea id="dcl" spellcheck="false" placeholder="20261101&#10;Maru 2 PR&#10;Villa F 7 (1F J2 + …) PR&#10;*Spider & Beehives クモの巣 & ハチの巣"></textarea>
        <h2 style="margin-top:16px">今日入住・退房名單（只給 Kayo 參考） <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">不影響清掃排班</span></h2>
        <textarea id="arr" spellcheck="false" style="min-height:150px;flex:none" placeholder="直接貼上 RMC check list，例如：placeholder="Maru 3 入住&#10;Koko 2 入住 17:00&#10;Runa 2 連住&#10;Villa G 4 退房&#10;Villa F 退房 / 入住 5"#10;KOKO need 2 (15:00check-in)placeholder="Maru 3 入住&#10;Koko 2 入住 17:00&#10;Runa 2 連住&#10;Villa G 4 退房&#10;Villa F 退房 / 入住 5"#10;MOKA CTSplaceholder="Maru 3 入住&#10;Koko 2 入住 17:00&#10;Runa 2 連住&#10;Villa G 4 退房&#10;Villa F 退房 / 入住 5"#10;Villa D x"></textarea>
        <div class="hint" id="arrSum" style="margin-top:6px"></div>
      </div>
      <div style="display:grid;gap:16px;min-width:0">
        <div class="panel">
          <h2>今天要清的房間 <span class="hint" id="roomCount" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2>
          <div class="tbl-wrap"><table id="roomsTbl"></table></div>
        </div>
        <div class="panel">
          <h2>今天上班的人</h2>
          <div class="staffday" id="staffDay"></div>
          <div class="totals" id="totals" style="margin-top:10px"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="boardbar">
        <div class="row">
          <button class="btn primary" id="auto">自動排班</button>
          <button class="btn" id="addBlock">＋ 屋外・屋上</button>
          <span class="hint" id="staleHint"></span>
        </div>
        <div class="seg" role="group" aria-label="顯示方式">
          <button id="vArea" aria-pressed="true">依區域</button>
          <button id="vStaff" aria-pressed="false">依員工</button>
        </div>
      </div>
      <div id="confirmBox"></div>
      <div class="board" id="board"><div class="board-inner" id="boardInner"></div></div>
      <p class="hint" style="margin:8px 0 0"><b>點各區「屋外・屋上」那一行的空白處</b>可新增屋外・屋上工作（落葉、除草、排水溝…）；拖曳色塊改時間（依員工檢視時，上下拖曳可換人）；拖右邊緣改長度；點一下色塊可細部修改。</p>
      <div id="editor" style="margin-top:12px"></div>
    </div>

    <div class="panel" id="messages" hidden></div>
    <div class="panel" id="checklists" hidden></div>

    <div class="grid2">
      <div class="panel">
        <h2>需要注意</h2>
        <div class="issues" id="issues"></div>
      </div>
      <div class="panel">
        <h2>分配表（傳給員工） <button class="btn sm" id="copy">複製</button></h2>
        <pre class="share" id="share"></pre>
      </div>
    </div>
    <div class="panel" id="sendPanel"></div>
  </section>

  <section id="view-set" hidden style="display:grid;gap:16px"></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>

const fmt = m => { m = Math.round(m); const h = Math.floor(m / 60), mm = ((m % 60) + 60) % 60; return h + ':' + String(mm).padStart(2, '0'); };
const norm = s => String(s || '').toLowerCase().replace(/[\s_\-・]/g, '');

    { name: 'Villa E', area: 'defg', base: 30, perGuest: 30 },
    { name: 'Villa F', area: 'defg', base: 30, perGuest: 30 },

  ],
  staff: [

       startAreas: where this person usually starts the day */

/* Room at the start of a line: by name or alias ("Grand V", "月江苑"); the longest match wins */
function matchRoomKey(line, rooms) {
  const n = norm(line); let best = null, key = '';
  for (const r of rooms) for (const nm of [r.name, ...(r.aliases || [])]) {
    const rn = norm(nm);
    if (rn && n.startsWith(rn) && rn.length > key.length) { best = r; key = rn; }
  }
  return [best, key];
}
function matchRoom(line, rooms) { return matchRoomKey(line, rooms)[0]; }
function stripKey(raw, key) {
  let i = 0, k = 0;
  while (i < raw.length && k < key.length) { const c = raw[i].toLowerCase(); if (/[\s_\-・]/.test(c)) { i++; continue; } if (c === key[k]) { k++; i++; } else break; }
  return raw.slice(i);
}

function parseDCL(text, S) {
  const out = { date: null, items: [], notes: [], skipped: [], staff: [] };
  const TR = /(\d{1,2})[:：](\d{2})\s*[-–—~～到至]\s*(\d{1,2})[:：](\d{2})/;
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  for (const raw of lines) {
    const dm = raw.match(/^(20\d{2})[\/\-.]?(\d{2})[\/\-.]?(\d{2})$/);
    if (dm) { out.date = `${dm[1]}-${dm[2]}-${dm[3]}`; continue; }
    if (/^[*＊・]/.test(raw)) { out.notes.push(raw.replace(/^[*＊・]\s*/, '')); continue; }
    if (/^(dcl\s*[＝=]|[（(]?\s*pr\s*[＝=])/i.test(raw) || /attention/i.test(raw)) continue;
    const [room, rkey] = matchRoomKey(raw, S.rooms);
    // staff line, e.g. "Akshay 9:30-12:00", "mahesh10:30-15:00", "Kayo 會 10:30~16:00 Glamping"
    const tr = raw.match(TR);
    if (tr && !room) {
      const n = norm(raw);
      let st = S.staff.filter(x => n.startsWith(norm(x.name))).sort((a, b) => b.name.length - a.name.length)[0];
      const nm = st ? st.name : (raw.match(/^([A-Za-z\u00C0-\u024F][A-Za-z\u00C0-\u024F .'-]*?)\s*(?=[^A-Za-z]|$)/) || [])[1];
      if (nm) {
        const after = raw.slice(raw.indexOf(tr[0]) + tr[0].length).toLowerCase();
        const area = S.areas.find(a => after.includes(a.name.toLowerCase()));
        out.staff.push({ name: st ? st.name : nm.trim().replace(/^./, c => c.toUpperCase()), known: !!st,
          start: `${+tr[1]}:${tr[2]}`, end: `${+tr[3]}:${tr[4]}`, ded: area ? area.id : '' });
        continue;
      }
    }
    let name, rest;
    if (room) {
      name = room.name;
      rest = stripKey(raw, rkey);
    } else {
      const m = raw.match(/^(.+?)\s+(\d+)(.*)$/) || raw.match(/^([A-Za-z][A-Za-z ]*?)\s*(\()(.*)$/);
      if (!m) { out.skipped.push(raw); continue; }
      name = m[1].trim(); rest = ' ' + m[2] + m[3];
    }
    const gm = rest.match(/^\s*(\d+)/);
    const bedTxt = (rest.match(/\(([^)]*)\)/) || [])[1] || '';
    let guests, guessed = false;
    if (gm) guests = +gm[1];
    else if (/^\s*\(/.test(rest)) { // no guest count written: estimate from bed codes like S2, J2, D1
      guests = [...bedTxt.matchAll(/\b[A-Z](\d+)\b/g)].reduce((a, x) => a + +x[1], 0) || 2; guessed = true;
    } else { out.skipped.push(raw); continue; }
    const outside = rest.replace(/\([^)]*\)/g, ' ');
    const am = outside.match(/(\d{1,2})[:：](\d{2})/);
    const arrival = am ? `${+am[1]}:${am[2]}` : '';
    const done = /cleaning\s*done/i.test(rest);
    const addM = rest.match(/additional\s*(\d+)/i);
    const tg = rest.match(/today'?s?\s*guest\s*is\s*(\d+)/i);
    const pr = /\bPR\b/.test(rest);
    const beds = (rest.match(/\(([^)]*)\)/) || [])[1] || '';
    const item = {
      room: name, known: !!room, area: room ? room.area : '',
      guests: tg ? +tg[1] : guests,
      mode: done ? 'add' : 'full',
      add: done ? (addM ? +addM[1] : Math.max(0, (tg ? +tg[1] : guests) - guests)) : 0,
      pr, beds, raw, guessed, arrival
    };
    out.items.push(item);
  }
  return out;
}

/* Today's room list for the final check (reference only, never changes the cleaning plan).
   Reads the RMC check list as it is: each room appears twice — FIRST check (after check-out) then LAST check
   (before check-in) — with need / CTS (continue to stay) / x (empty), guests, check-in time and notes.
   Also reads a plain list: "Maru 3 入住", "Runa 2 連住", "Villa G 退房". */
function parseArrivals(text, S) {
  const out = { items: [], skipped: [], reminders: [], date: null, format: 'plain' };
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const rmc = lines.filter(l => /\s(need|cts|x)\b/i.test(l)).length >= 3;
  if (rmc) out.format = 'rmc';
  const seen = {};
  for (const raw of lines) {
    const dm = raw.match(/(20\d{2})[\/\-.年]?(\d{1,2})[\/\-.月]?(\d{1,2})/);
    if (dm && raw.replace(/[【】\[\]\s]/g, '').length <= 12) { out.date = `${dm[1]}-${dm[2].padStart(2, '0')}-${dm[3].padStart(2, '0')}`; continue; }
    if (/^RMC\b/i.test(raw) || /check\s*:\s*done/i.test(raw)) continue;
    if (/^※/.test(raw) || /^\[/.test(raw)) { out.reminders.push(raw.replace(/^※\s*/, '')); continue; }
    if (/^[=＝-]{3,}$/.test(raw) || /💡|◆|check\s*:?\s*$|check\s*:\s*done/i.test(raw) && !/\s(need|cts)\b/i.test(raw)) continue;
    if (/^[*＊]/.test(raw)) continue;
    let [room, key] = matchRoomKey(raw, S.rooms);
    let name, rest;
    if (room) { name = room.name; rest = stripKey(raw, key); }
    else {
      const m = rmc ? raw.match(/^(.+?)\s+(need|cts|x)\b(.*)$/i)
        : raw.match(/^([A-Za-z぀-ヿ一-鿿][^\d:：]*?)\s*(?=\d|[（(]|入住|退房|連住|續住|$)(.*)$/);
      if (!m || !m[1].trim()) { (rmc ? out.reminders : out.skipped).push(raw); continue; }
      name = m[1].trim(); rest = rmc ? ` ${m[2]}${m[3]}` : (m[2] || '');
    }
    const parens = [...rest.matchAll(/[（(]([^)）]*)[)）]/g)].map(x => x[1].trim());
    const bare = rest.replace(/[（(][^)）]*[)）]/g, ' ');
    const tm = rest.match(/(\d{1,2})[:：](\d{2})(?:\s*[-–~～]\s*(\d{1,2})[:：](\d{2}))?/);
    const gm = bare.replace(/\d{1,2}[:：]\d{2}/g, ' ').match(/(\d+)\s*(?:名|人|pax|guests?|位)?/i);
    const notes = parens.filter(p => !/^\s*\d{1,2}[:：]\d{2}/.test(p));
    const timeNote = parens.find(p => /^\s*\d{1,2}[:：]\d{2}/.test(p)) || '';
    let type;
    if (rmc) {
      const st = (bare.match(/\b(need|cts|x)\b/i) || [])[1];
      if (!st) { out.skipped.push(raw); continue; }
      type = { need: 'in', cts: 'stay', x: 'empty' }[st.toLowerCase()];
    } else {
      const isIn = /入住|チェックイン|check\s*-?\s*in|\bin\b|\bc\/i\b|到着/i.test(rest);
      const isOut = /退房|チェックアウト|check\s*-?\s*out|\bout\b|\bc\/o\b/i.test(rest);
      const isStay = /連住|續住|续住|続泊|連泊|stay/i.test(rest);
      type = isStay ? 'stay' : isOut && isIn ? 'outin' : isOut ? 'out' : 'in';
    }
    const it = { room: name, area: room ? room.area : '', guests: gm ? +gm[1] : null, arrival: tm ? `${+tm[1]}:${tm[2]}` : '',
      window: tm && tm[3] ? `${+tm[1]}:${tm[2]}–${+tm[3]}:${tm[4]}` : '', timeNote, notes, type, first: null, raw };
    const k = name.toLowerCase();
    if (rmc && seen[k]) { it.first = seen[k].type; Object.assign(seen[k], it); continue; }  // 2nd time = LAST check
    seen[k] = it; out.items.push(it);
  }
  // in the RMC list a room seen only in the FIRST check keeps that status as its only information
  return out;
}

function itemMinutes(it, S) {
  if (it.mins != null && it.mins !== '') return +it.mins;
  const r = S.rules;
  if (it.mode === 'add') return r.addBase + r.addPer * Math.max(1, it.add || 1);
  const room = S.rooms.find(x => x.name === it.room);
  const base = room ? room.base : 30, per = room ? room.perGuest : 30;
  return base + per * (it.guests || 0);
}

/* Find earliest start >= from for duration d in staff s, considering busy blocks and travel */
function earliestSlot(s, area, from, d, travel) {
  let t = Math.max(from, s.st);
  for (let guard = 0; guard < 200; guard++) {
    const busy = s.busy.slice().sort((a, b) => a.start - b.start);
    let prev = null;
    for (const b of busy) if (b.start + b.dur <= t) prev = b;
    let tt = t;
    if (prev && prev.area !== area) tt = Math.max(tt, prev.start + prev.dur + travel);
    const clash = busy.find(b => b.start < tt + d && b.start + b.dur > tt);
    if (!clash) {
      // also need travel after this block to the next one if area differs (soft: ignore)
      return { start: tt, switched: !!(prev && prev.area !== area) };
    }
    t = clash.start + clash.dur;
  }
  return { start: t, switched: false };
}

/* First free gap (>= minLen) within shift; returns {start, len, switched} or null */
function firstGap(s, area, travel, minLen) {
  const busy = s.busy.slice().sort((a, b) => a.start - b.start);
  let t = s.st;
  for (let guard = 0; guard < 200 && t < s.en; guard++) {
    let prev = null;
    for (const b of busy) if (b.start + b.dur <= t) prev = b;
    const t2 = prev && prev.area !== area ? Math.max(t, prev.start + prev.dur + travel) : t;
    const cover = busy.find(b => b.start <= t2 && b.start + b.dur > t2);
    if (cover) { t = cover.start + cover.dur; continue; }
    const next = busy.find(b => b.start > t2);
    const limit = Math.min(next ? next.start - (next.area !== area ? travel : 0) : Infinity, s.en);
    if (limit - t2 >= minLen) return { start: t2, len: limit - t2, switched: !!(prev && prev.area !== area) };
    if (!next) return null;
    t = next.start + next.dur;
  }
  return null;
}

/* When a room must be finished: PR rooms by the PR target (default 14:30);
   a PR room whose guest arrives later (e.g. 17:00) can wait until the arrival time. */
function roomDeadline(it, S) {
  if (!it.pr) return null;
  const prT = T(S.rules.prTarget || '14:30');
  return it.arrival ? Math.max(prT, T(it.arrival)) : prT;
}

function schedule(items, staffDay, S, keep = [], arrivals = []) {
  const R = S.rules, checkin = T(R.checkin), blocks = []; let id = 1;
  const staff = staffDay.filter(s => s.on).map(s => {
    const cfg = S.staff.find(x => x.name === s.name) || {};
    return { name: s.name, st: T(s.start), en: T(s.end), prefs: s.ded ? [s.ded] : (cfg.prefs || []), ded: s.ded || '', role: cfg.role || 'clean', startAreas: s.ded ? [s.ded] : (cfg.startAreas || []), busy: [] };
  });
  for (const k of keep) {
    const s = staff.find(x => x.name === k.staff);
    const b = { ...k, id: 'b' + id++, rooms: [] };
    blocks.push(b); if (s) s.busy.push(b);
  }
  for (const s of staff) {
    if (!s.ded) continue;
    for (const r of ((S.routines || {})[s.ded] || [])) {
      if (!r.time || !(+r.dur > 0)) continue;
      const b = { id: 'b' + id++, staff: s.name, area: s.ded, start: T(r.time), dur: +r.dur, rooms: [], label: r.title, rid: r.id, kind: 'routine' };
      blocks.push(b); s.busy.push(b);
    }
  }
  for (const f of S.fixed) {
    if (f.on === false) continue;
    const s = staff.find(x => x.name === f.staff);
    if (!s) continue;
    if (s.ded && s.busy.some(b => b.start < T(f.start) + +f.dur && b.start + b.dur > T(f.start))) continue;
    const b = { id: 'b' + id++, staff: f.staff, area: f.area, start: T(f.start), dur: +f.dur, rooms: [], label: f.label, kind: 'fixed' };
    blocks.push(b); s.busy.push(b);
  }
  const areaIdx = a => { const i = S.areas.findIndex(x => x.id === a); return i < 0 ? 99 : i; };
  const tasks = items.filter(it => !it.skip).map(it => ({ it, mins: itemMinutes(it, S), area: it.area || '_none', dl: roomDeadline(it, S) }))
    .filter(t => t.mins > 0);
  // PR rooms first, earliest deadline first; then bigger rooms first
  tasks.sort((a, b) => (b.it.pr - a.it.pr) || ((a.dl ?? 9999) - (b.dl ?? 9999)) || (b.mins - a.mins) || (areaIdx(a.area) - areaIdx(b.area)));
  const unplaced = [];
  // first room of the day for each person: one in the area where they usually start (PR / earliest deadline first)
  const seeded = new Set();
  for (const st of staff.filter(x => x.role !== 'inspector' && !x.ded && x.startAreas.length).sort((a, b) => a.st - b.st)) {
    if (st.busy.some(x => x.kind === 'clean')) continue;
    const task = tasks.find(t => !seeded.has(t) && st.startAreas.includes(t.area) && t.mins <= R.maxSolo);
    if (!task) continue;
    const g = firstGap(st, task.area, R.travel, task.mins);
    if (!g || (task.dl != null && g.start + task.mins > task.dl)) continue;
    const b = { id: 'b' + id++, staff: st.name, area: task.area, start: g.start, dur: task.mins, rooms: [task.it.room], team: 1, kind: 'clean' };
    blocks.push(b); st.busy.push(b); seeded.add(task);
  }
  for (const task of tasks) {
    if (seeded.has(task)) continue;
    if (!staff.length) { unplaced.push({ room: task.it.room, mins: task.mins, pr: !!task.it.pr }); continue; }
    // a person dedicated to this area takes the whole room if they can finish it (PR rooms before check-in)
    const dedStaff = staff.filter(s => s.ded === task.area);
    if (dedStaff.length && task.mins <= R.maxSolo) {
      let pick = null;
      for (const s of dedStaff) {
        const g = firstGap(s, task.area, R.travel, task.mins);
        if (!g) continue;
        const fin = g.start + task.mins;
        if (task.dl != null && fin > task.dl) continue;
        if (!pick || fin < pick.fin) pick = { s, start: g.start, fin };
      }
      if (pick) {
        const b = { id: 'b' + id++, staff: pick.s.name, area: task.area, start: pick.start, dur: task.mins, rooms: [task.it.room], team: 1, kind: 'clean' };
        blocks.push(b); pick.s.busy.push(b);
        continue;
      }
    }
    const k = Math.max(1, Math.min(Math.ceil(task.mins / R.maxSolo), R.maxTeam, staff.length));
    const queue = [];
    const each = Math.ceil(task.mins / k / R.snap) * R.snap;
    for (let j = 0; j < k; j++) queue.push(each);
    const used = new Set();
    let people = 0;
    let firstPieces = k;
    while (queue.length) {
      const d = queue.shift();
      const fresh = firstPieces-- > 0; // first k pieces go to different people
      let best = null;
      for (const s of staff) {
        if (fresh && used.has(s.name)) continue;
        if (s.ded && s.ded !== task.area) continue;
        if (s.role === 'inspector') continue;
        const gap = firstGap(s, task.area, R.travel, Math.min(d, 30));
        if (!gap) continue;
        let dur = Math.min(d, Math.floor(gap.len / R.snap) * R.snap);
        if (dur < d && d - dur < 20) dur = d - 20;   // never leave a sliver under 20 min
        if (dur < Math.min(d, 30)) continue;
        const fin = gap.start + dur;
        let score = gap.start + d + (dur < d ? (d <= 120 ? 90 : 30) : 0); // splitting a small room means a handover: avoid it
        if (!s.prefs.includes(task.area)) score += R.nonPrefPenalty;
        if (s.ded === task.area) score -= 60;
        // first room of the day: where this person usually starts
        if (s.startAreas.length && !s.busy.some(x => x.kind === 'clean') && !s.startAreas.includes(task.area)) score += (R.startPenalty ?? 80);
        if (gap.switched) score += R.switchPenalty;
        if (task.dl != null && fin > task.dl) score += 500 + (fin - task.dl) * 3;
        if (!best || score < best.score) best = { s, start: gap.start, dur, score };
      }
      if (!best) { // nobody has time left within their shift: leave it unassigned
        unplaced.push({ room: task.it.room, mins: d + queue.reduce((a, x) => a + x, 0), pr: !!task.it.pr });
        break;
      }
      if (best.dur < d) queue.push(d - best.dur);
      if (!used.has(best.s.name)) people++;
      used.add(best.s.name);
      const b = { id: 'b' + id++, staff: best.s.name, area: task.area, start: best.start, dur: best.dur, rooms: [task.it.room], team: 0, kind: 'clean' };
      blocks.push(b); best.s.busy.push(b);
    }
    for (const b of blocks) if (b.kind === 'clean' && b.rooms[0] === task.it.room) b.team = people;
  }
  // quality & hygiene check: inspectors visit each room after it is cleaned, PR first, in finishing order
  const inspectors = staff.filter(s => s.role === 'inspector');
  const uninspected = [], lateChecks = [];
  if (inspectors.length) {
    const done = {};
    for (const b of blocks) if (b.kind === 'clean') for (const r of b.rooms) done[r] = Math.max(done[r] || 0, b.start + b.dur);
    const order = tasks.filter(t => done[t.it.room] != null)
      .map(t => { // the check list's check-in time (if given) only orders the final check; it never moves cleaning
        const a = arrivals.find(x => x.room === t.it.room && x.arrival); const arr = t.it.arrival || (a && a.arrival);
        return { room: t.it.room, area: t.area, done: done[t.it.room], pr: !!t.it.pr, dl: arr ? T(arr) : checkin }; });
    // walk the rooms as they become ready; stay in the same area when possible to save walking
    const im = +R.inspectMins || 15;
    const cur = new Map(inspectors.map(s => [s.name, { t: s.st, area: null }]));
    let left = order.slice();
    while (left.length) {
      const s = inspectors.slice().sort((a, b) => cur.get(a.name).t - cur.get(b.name).t)[0];
      const c = cur.get(s.name);
      const ready = left.filter(o => o.done <= c.t);
      const pool = ready.length ? ready : [left.slice().sort((a, b) => a.done - b.done)[0]];
      const urgent = o => o.dl <= c.t + 60;   // guests arriving within the hour: go there first
      pool.sort((a, b) => (urgent(b) - urgent(a)) || ((b.area === c.area) - (a.area === c.area)) || (a.dl - b.dl) || (b.pr - a.pr) || (a.done - b.done));
      const t = pool[0];
      left = left.filter(o => o !== t);
      // try every inspector for this room
      let pick = null;
      for (const x of inspectors) {
        const slot = earliestSlot(x, t.area, Math.max(cur.get(x.name).t, x.st, t.done), im, R.travel);
        if (slot.start + im > x.en) continue;
        if (!pick || slot.start < pick.start) pick = { s: x, start: slot.start };
      }
      if (!pick) { uninspected.push(t.room); continue; }
      cur.set(pick.s.name, { t: pick.start + im, area: t.area });
      if (pick.start + im > t.dl) lateChecks.push({ room: t.room, at: pick.start + im, dl: t.dl });
      const last = pick.s.busy.filter(b => b.kind === 'inspect').sort((a, b) => a.start - b.start).pop();
      if (last && last.area === t.area && last.start + last.dur === pick.start) { last.dur += im; last.rooms.push(t.room); last.label = 'Quality check: ' + last.rooms.join(', '); continue; }
      const b = { id: 'b' + id++, staff: pick.s.name, area: t.area, start: pick.start, dur: im, rooms: [t.room], kind: 'inspect', label: 'Quality check: ' + t.room };
      blocks.push(b); pick.s.busy.push(b);
    }
  }
  return { blocks: mergeBlocks(blocks), unplaced, uninspected, lateChecks, nextId: id };
}

function mergeBlocks(blocks) {
  const fixed = blocks.filter(b => b.kind !== 'clean');
  const clean = blocks.filter(b => b.kind === 'clean').sort((a, b) => a.staff.localeCompare(b.staff) || a.start - b.start);
  const out = [];
  for (const b of clean) {
    const last = out[out.length - 1];
    if (last && last.staff === b.staff && last.area === b.area && b.start - (last.start + last.dur) <= 0) {
      last.dur = b.start + b.dur - last.start;
      const lp = last.parts[last.parts.length - 1];
      if (lp.room === b.rooms[0]) lp.dur += b.dur;
      else last.parts.push({ room: b.rooms[0], team: b.team, dur: b.dur });
      last.rooms = [...new Set(last.parts.map(p => p.room))];
    } else out.push({ ...b, parts: [{ room: b.rooms[0], team: b.team, dur: b.dur }] });
  }
  return [...out, ...fixed.map(b => ({ ...b, parts: [] }))];
}

/* Each room part's own time window inside its (possibly merged / edited) bar */
function partWindows(b) {
  const parts = b.parts && b.parts.length ? b.parts : (b.rooms || []).map(r => ({ room: r, dur: b.dur / Math.max(1, b.rooms.length) }));
  const sum = parts.reduce((a, p) => a + (p.dur || 0), 0) || 1;
  const k = b.dur / sum; let t = b.start;
  return parts.map(p => { const w = { room: p.room, team: p.team, start: t, end: t + p.dur * k }; t = w.end; return w; });
}

function findIssues(plan, items, staffDay, S) {
  const issues = [], checkin = T(S.rules.checkin);
  const short = items.some(it => !it.skip && !plan.blocks.some(b => b.kind === 'clean' && (b.rooms || []).includes(it.room))) || (plan.unplaced || []).length;
  const spare = S.staff.filter(s => s.role === 'backup' && !staffDay.some(d => d.on && d.name === s.name));
  for (const l of plan.lateChecks || []) issues.push({ lvl: 'warn', ids: plan.blocks.filter(b => b.kind === 'inspect' && b.rooms.includes(l.room)).map(b => b.id), msg: `${l.room} 的品質確認 ${fmt(l.at)} 才結束，晚於客人抵達／入住 ${fmt(l.dl)}` });
  if ((plan.uninspected || []).length) issues.push({ lvl: 'warn', ids: [], msg: `品質確認時間不夠，還沒排到：${plan.uninspected.join('、')}（可延長確認人員的時間，或手動加一段）` });
  if (short && spare.length) issues.push({ lvl: 'warn', ids: [], msg: `人手不夠：可以勾選後備人員 ${spare.map(s => s.name).join('、')}（或在 DCL 加一行時間），再按「自動排班」` });
  const on = new Map(staffDay.filter(s => s.on).map(s => [s.name, s]));
  const byStaff = {};
  for (const b of plan.blocks) (byStaff[b.staff] = byStaff[b.staff] || []).push(b);
  for (const [name, bl] of Object.entries(byStaff)) {
    const sd = on.get(name);
    if (!sd) { issues.push({ lvl: 'bad', ids: bl.map(b => b.id), msg: `${name} 今天沒有排班，但被分配了工作` }); continue; }
    bl.sort((a, b) => a.start - b.start);
    for (let i = 1; i < bl.length; i++) {
      const a = bl[i - 1], b = bl[i];
      if (b.start < a.start + a.dur) issues.push({ lvl: 'bad', ids: [a.id, b.id], msg: `${name} 時段重疊：${fmt(b.start)}` });
    }
    const first = bl[0], last = bl[bl.length - 1];
    if (first.start < T(sd.start)) issues.push({ lvl: 'warn', ids: [first.id], msg: `${name} 在上班時間 ${sd.start} 前就開始` });
    if (last.start + last.dur > T(sd.end)) issues.push({ lvl: 'warn', ids: [last.id], msg: `${name} 超過下班時間 ${sd.end}（到 ${fmt(last.start + last.dur)}）` });
  }
  for (const it of items) {
    if (it.skip) continue;
    const bl = plan.blocks.filter(b => b.kind === 'clean' && (b.rooms || []).includes(it.room));
    if (!bl.length) { issues.push({ lvl: 'bad', ids: [], msg: `${it.room}${it.pr ? '（PR）' : ''} 還沒有人負責，請分配給某人或加人` }); continue; }
    const end = Math.max(...bl.flatMap(b => partWindows(b).filter(w => w.room === it.room).map(w => w.end)));
    const dl = roomDeadline(it, S);
    if (it.pr && it.arrival && end > dl) issues.push({ lvl: 'bad', ids: bl.map(b => b.id), msg: `${it.room}（PR）預計 ${fmt(end)} 完成，晚於客人抵達 ${it.arrival}` });
    else if (it.pr && !it.arrival && end > checkin) issues.push({ lvl: 'bad', ids: bl.map(b => b.id), msg: `${it.room}（PR）預計 ${fmt(end)} 完成，晚於入住 ${S.rules.checkin}` });
    else if (it.pr && !it.arrival && end > dl) issues.push({ lvl: 'warn', ids: bl.map(b => b.id), msg: `${it.room}（PR）預計 ${fmt(end)} 完成，超過目標 ${S.rules.prTarget}（入住前還來得及）` });
    const un = (plan.unplaced || []).find(u => u.room === it.room);
    if (un) issues.push({ lvl: 'bad', ids: bl.map(b => b.id), msg: `${it.room}${it.pr ? '（PR）' : ''} 還差約 ${un.mins} 分鐘沒人有空做` });
    if (!it.area) issues.push({ lvl: 'warn', ids: [], msg: `${it.room} 不在房間清單裡，請到「設定」指定區域` });
  }
  return issues;
}

    const g = a && a.guests != null ? a.guests : (it ? it.guests : null);

    const names = l => l.map(x => x.room).join(', ');

    if (stay.length) other.push(`🛏️ CTS / staying: ${names(stay)}`);

  for (let m = Math.ceil(d0 / 30) * 30; m < d1; m += 30) ticks += `<div class="tick ${m % 60 ? 'half' : ''}" style="left:${LABEL + x(m)}px"><span>${fmt(m)}</span></div>`;
  const ci = T(R.checkin);
  ticks += `<div class="checkin-flag" style="left:${LABEL + x(ci)}px">${fmt(ci)} 入住</div>`;
  let vlines = '';
  for (let m = Math.ceil(d0 / 30) * 30; m < d1; m += 30) vlines += `<div class="vline ${m % 60 ? '' : 'hour'}" style="left:${x(m)}px"></div>`;
  vlines += `<div class="vline ci" style="left:${x(ci)}px"></div>`;
  // groups
  let groups;
  if (view === 'area') {
    const ids = S.areas.map(a => a.id);
    P.blocks.forEach(b => { if (!ids.includes(b.area)) ids.push(b.area); });
    // every area gets two lanes: rooms, then its outdoor work
    groups = ids.flatMap(id => [
      { key: id, lane: 'rooms', title: areaName(id), sub: '', blocks: P.blocks.filter(b => b.area === id && b.kind !== 'task') },
      { key: id, lane: 'outdoor', title: `${areaName(id)} 屋外・屋上`, sub: 'Outdoor, Roof top Balcony', blocks: P.blocks.filter(b => b.area === id && b.kind === 'task') }
    ]);
  } else {
    const names = P.staffDay.filter(s => s.on).map(s => s.name);
    P.blocks.forEach(b => { if (!names.includes(b.staff)) names.push(b.staff); });
    groups = names.map(n => { const sd = P.staffDay.find(s => s.name === n); return { key: n, title: n, sub: sd && sd.on ? `${sd.start}–${sd.end}` : '今天休', blocks: P.blocks.filter(b => b.staff === n) }; });
  }
  const LANE = 38;
  let html = `<div class="ticks">${ticks}</div>`;
  for (const g of groups) {
    const bl = g.blocks.slice().sort((a, b) => a.start - b.start);
    const lanes = [];
    const pos = {};
    for (const b of bl) {
      let li = lanes.findIndex(end => end <= b.start);
      if (li < 0) { li = lanes.length; lanes.push(0); }
      lanes[li] = b.start + b.dur; pos[b.id] = li;
    }
    const n = Math.max(1, lanes.length);
    const H = n * LANE + 8;
    let bars = '';
    for (const b of bl) {
      const fixed = b.kind !== 'clean';
      const top = 4 + pos[b.id] * LANE;
      const rooms = fixed ? (b.label || '') : partLabel(b);
      const main = view === 'area' ? b.staff : (fixed ? areaName(b.area) : areaName(b.area));
      const subt = view === 'area' ? rooms : (fixed ? b.label : rooms);
      const prLate = badIds.has(b.id);
      bars += `<div class="bar ${fixed ? 'fixed' : ''} ${b.kind === 'task' ? 'task' : ''} ${b.id === selId ? 'sel' : ''} ${prLate ? 'bad' : ''}" data-id="${b.id}"
        style="left:${x(b.start)}px;top:${top}px;width:${Math.max(18, b.dur * ppm - 2)}px;${fixed ? '' : `background:${staffColor(b.staff)}`}"
        title="${esc(`${b.staff}｜${areaName(b.area)}｜${fmt(b.start)}–${fmt(b.start + b.dur)}｜${rooms}`)}" tabindex="0" role="button">
        <span class="n">${esc(main)} <span class="mono" style="font-weight:400;font-size:11px">${fmt(b.start)}–${fmt(b.start + b.dur)}</span></span>
        <span class="r">${esc(subt)}</span>
        <span class="h" data-resize="${b.id}"></span>
      </div>`;
    }
    html += `<div class="group ${g.lane === 'outdoor' ? 'out' : ''} ${g.lane === 'rooms' ? 'rooms' : ''}" data-group="${esc(g.key)}" data-lane="${g.lane || ''}">
      <div class="glabel" style="width:${LABEL}px;min-height:${H}px">${esc(g.title)}${g.sub ? `<small>${esc(g.sub)}</small>` : ''}</div>
      <div class="gtrack" style="width:${W}px;min-height:${H}px">${vlines}${bars}</div>
    </div>`;
  }
  inner.innerHTML = html;
}
function partLabel(b) {
  const ws = partWindows(b);
  const its = items().items;
  const seen = new Set(); const out = [];
  for (const w of ws) {
    if (seen.has(w.room)) continue; seen.add(w.room);
    const it = its.find(i => i.room === w.room);
    out.push(w.room + (w.team > 1 ? `（${w.team}人）` : '') + (it && it.pr ? ' PR' : ''));
  }
  return out.join('、');
}

function routineFor(area) { return ((S.routines || {})[area] || []).slice(); }
const EN_DAY = d => { const x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
const hhmm = m => fmt(m).padStart(5, '0');
/* 24-hour time dropdown in 15-minute steps; `empty` adds a blank choice with that label */
function tsel(v, attrs, empty, prefer) {
  const cur = v ? fmt(T(v)) : '';
  const vals = []; for (let m = 0; m < 24 * 60; m += 15) vals.push(fmt(m));
  if (cur && !vals.includes(cur)) { vals.push(cur); vals.sort((a, b) => T(a) - T(b)); }
  const opt = x => `<option value="${x}" ${x === cur ? 'selected' : ''}>${x.padStart(5, '0')}</option>`;
  const blank = empty != null ? `<option value="" ${cur ? '' : 'selected'}>${esc(empty)}</option>` : '';
  if (prefer && prefer.length) { // common times first, everything else below
    const pf = prefer.map(x => fmt(T(x)));
    // the full list keeps every time in order; a common time is selected in the top group only
    const inTop = pf.includes(cur);
    const optAll = x => `<option value="${x}" ${x === cur && !inTop ? 'selected' : ''}>${x.padStart(5, '0')}</option>`;
    return `<select class="tsel" ${attrs}>${blank}<optgroup label="常用">${pf.map(opt).join('')}</optgroup><optgroup label="全部時間">${vals.map(optAll).join('')}</optgroup></select>`;
  }
  return `<select class="tsel" ${attrs}>${blank}${vals.map(opt).join('')}</select>`;
}

function checklistText(sd, its) {
  const area = sd.ded, name = sd.name;
  const lines = [`${areaName(area).toUpperCase()} — ${name}`, `${EN_DAY(P.date)} · Shift ${hhmm(T(sd.start))}–${hhmm(T(sd.end))} · Check-in ${hhmm(T(S.rules.checkin))}`, ''];
  const events = []; // {t, order, lines[]}
  const routines = routineFor(area);
  const mine = P.blocks.filter(b => b.staff === name);
  // routine blocks (follow the board if they were moved)
  for (const r of routines) {
    if (!r.time) continue;
    if (+r.dur > 0) {
      const b = mine.find(x => x.rid === r.id);
      if (!b) continue;
      events.push({ t: b.start, o: 0, lines: [`${hhmm(b.start)}–${hhmm(b.start + b.dur)}  ${r.title}`, ...r.details.map(x => `   □ ${x}`)] });
    } else {
      events.push({ t: T(r.time), o: 1, lines: [`${hhmm(T(r.time))}        □ ${r.title}${r.details.length ? ' — ' + r.details.join(', ') : ''}`] });
    }
  }
  // other fixed blocks on this person (e.g. Last check)
  for (const b of mine.filter(b => b.kind === 'task')) events.push({ t: b.start, o: 0, lines: [`${hhmm(b.start)}–${hhmm(b.start + b.dur)}  Outdoor / Roof top Balcony (${areaName(b.area)})`, ...(b.tasks || []).map(x => `   □ ${x}`)] });
  for (const b of mine.filter(b => b.kind === 'fixed')) events.push({ t: b.start, o: 0, lines: [`${hhmm(b.start)}–${hhmm(b.start + b.dur)}  ${b.label || ''} (${areaName(b.area)})`] });
  // rooms
  const wins = [];
  for (const b of mine.filter(b => b.kind === 'clean')) for (const w of partWindows(b)) wins.push({ ...w, area: b.area });
  wins.sort((a, b) => a.start - b.start);
  // merge consecutive windows of the same room
  const rw = [];
  for (const w of wins) { const l = rw[rw.length - 1]; if (l && l.room === w.room && Math.abs(l.end - w.start) < 1) l.end = w.end; else rw.push({ ...w }); }
  if (rw.length) {
    events.push({ t: rw[0].start, o: -1, lines: [`${hhmm(rw[0].start)}  Guest rooms — start preparing (PR first)`] });
    for (const w of rw) {
      const roomLines = [];
      const it = its.items.find(i => i.room === w.room) || {};
      const helpers = P.blocks.filter(b => b.kind === 'clean' && b.staff !== name && (b.rooms || []).includes(w.room)).map(b => b.staff);
      const what = it.mode === 'add' ? `already cleaned — add set-up for +${it.add} (${it.guests} guests)` : `${it.guests || '?'} guests`;
      roomLines.push(`   □ ${hhmm(w.start)}–${hhmm(w.end)}  ${w.room}${it.pr ? '  ★PR' : ''} · ${what}${it.beds ? ` · ${it.beds}` : ''}${helpers.length ? ` · with ${[...new Set(helpers)].join(', ')}` : ''}`);
      events.push({ t: w.start, o: 2, lines: roomLines });
    }
  }
  events.sort((a, b) => a.t - b.t || a.o - b.o);
  for (const e of events) lines.push(...e.lines);
  const allDay = routines.filter(r => !r.time);
  if (allDay.length) { lines.push('', 'ALL DAY'); allDay.forEach(r => lines.push(`   □ ${r.title}${r.details.length ? ' — ' + r.details.join(', ') : ''}`)); }
  // rooms in this area done by others
  const others = [];
  for (const it of its.items.filter(i => !i.skip && i.area === area)) {
    if (rw.some(w => w.room === it.room)) continue;
    const bl = P.blocks.filter(b => b.kind === 'clean' && (b.rooms || []).includes(it.room));
    others.push(`   · ${it.room}${it.pr ? ' ★PR' : ''} — ${bl.length ? [...new Set(bl.map(b => b.staff))].join(', ') : 'not assigned yet'}`);
  }
  if (others.length) { lines.push('', `OTHER ${areaName(area).toUpperCase()} ROOMS (done by others)`, ...others); }
  const notes = its.notes.length ? its.notes : S.attention;
  if (notes.length) { lines.push('', 'ATTENTION — EACH ROOM'); notes.forEach(x => lines.push('   ! ' + x)); }
  return lines.join('\n');
}

function shareText(its) {
  if (!P.blocks.length) return '（排班後會產生可以直接貼到群組的分配表）';
  const lines = [`【${P.date} 清掃分配】 PR 房 ${S.rules.prTarget} 前完成・入住 ${S.rules.checkin}`, ''];
  const names = [...new Set([...P.staffDay.filter(s => s.on).map(s => s.name), ...P.blocks.map(b => b.staff)])];
  for (const n of names) {
    const bl = P.blocks.filter(b => b.staff === n).sort((a, b) => a.start - b.start);
    if (!bl.length) continue;
    lines.push(`■ ${n}`);
    for (const b of bl) {
      const what = b.kind === 'clean' ? partLabel(b) : (b.label || '');
      lines.push(`  ${fmt(b.start).padStart(5)}–${fmt(b.start + b.dur).padEnd(5)}  ${areaName(b.area)}｜${what}`);
    }
    lines.push('');
  }
  const missing = its.items.filter(i => !i.skip).map(i => {
    const has = P.blocks.some(b => b.kind === 'clean' && (b.rooms || []).includes(i.room));
    const un = (P.unplaced || []).find(u => u.room === i.room);
    return !has ? `${i.room}${i.pr ? ' PR' : ''}（全部）` : un ? `${i.room}${i.pr ? ' PR' : ''}（還差約 ${un.mins} 分）` : null;
  }).filter(Boolean);
  if (missing.length) { lines.push('⚠️ 未分配：' + missing.join('、'), ''); }
  const notes = its.notes.length ? its.notes : S.attention;
  if (notes.length) { lines.push('‼️ Attention each villa'); notes.forEach(x => lines.push('・' + x)); }
  return lines.join('\n').trim();
}

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1600); }
function changed() { savePlan(); renderAll(); }

/* Staff lines in the DCL ("Akshay 9:30-12:00") set today's roster: listed people on with those hours, others off.
   Applied only when those lines change, so ticking someone on by hand afterwards sticks. */
function applyDclStaff() {
  const list = parseDCL(P.dcl, S).staff;
  const key = JSON.stringify(list);
  if (key === (P.dclStaff || '[]')) return false;
  P.dclStaff = key;
  if (!list.length) return false;
  let added = [];
  for (const x of list) if (!S.staff.some(s => s.name === x.name)) {
    S.staff.push({ name: x.name, start: x.start, end: x.end, prefs: S.areas.map(a => a.id), color: S.staff.length % COLORS.length });
    added.push(x.name);
  }
  if (added.length) { saveSettings(); toast(`新員工 ${added.join('、')} 已加入設定`); }
  syncStaffDay();
  for (const sd of P.staffDay) {
    const x = list.find(q => q.name === sd.name);
    if (x) { sd.on = true; sd.start = x.start; sd.end = x.end; sd.ded = x.ded || ''; }
    else { sd.on = false; sd.ded = ''; }
  }
  return true;
}

$('dcl').addEventListener('input', async e => {
  const txt = e.target.value;

  if (d && d !== P.date && !knownDates.has(d)) {
    // pasted a DCL for another day: keep this day as it was, open that day with the new DCL
    const old = P;

$('staffDay').addEventListener('change', e => {

/* drag / resize / select on the board */
let drag = null;
$('boardInner').addEventListener('pointerdown', e => {
  const bar = e.target.closest('.bar'); if (!bar || e.button > 0) return;
  const b = P.blocks.find(x => x.id === bar.dataset.id); if (!b) return;
  drag = { b, bar, x0: e.clientX, y0: e.clientY, mode: e.target.closest('[data-resize]') ? 'resize' : 'move', moved: false, start: b.start, dur: b.dur };
  bar.setPointerCapture(e.pointerId);
});
$('boardInner').addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; drag.bar.classList.add('dragging');
  const snap = S.rules.snap || 5, dm = Math.round(dx / geo.ppm / snap) * snap;
  if (drag.mode === 'resize') {
    const nd = Math.max(snap * 2, drag.dur + dm);
    drag.bar.style.width = Math.max(18, nd * geo.ppm - 2) + 'px'; drag.nd = nd;
  } else {
    const ns = Math.min(Math.max(geo.d0, drag.start + dm), geo.d1 - drag.dur);
    drag.bar.style.left = (ns - geo.d0) * geo.ppm + 'px'; drag.bar.style.transform = `translateY(${dy}px)`; drag.ns = ns;
    document.querySelectorAll('.glabel.drop').forEach(g => g.classList.remove('drop'));
    const g = groupAt(e.clientX, e.clientY); if (g) g.querySelector('.glabel').classList.add('drop');
  }
});
function groupAt(cx, cy) {
  for (const g of document.querySelectorAll('#boardInner .group')) { const r = g.getBoundingClientRect(); if (cy >= r.top && cy < r.bottom) return g; }
  return null;
}
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll('.glabel.drop').forEach(g => g.classList.remove('drop'));
  if (!d.moved) { selId = selId === d.b.id ? null : d.b.id; renderBoard(); renderEditor(); return; }
  if (cancel) { renderBoard(); return; }
  if (d.mode === 'resize' && d.nd) d.b.dur = d.nd;
  if (d.mode === 'move') {
    if (d.ns != null) d.b.start = d.ns;
    const g = groupAt(e.clientX, e.clientY);
    if (g && Math.abs(e.clientY - d.y0) > 12) {
      const key = g.dataset.group;
      if (view === 'staff') d.b.staff = key;
      else {
        const lane = g.dataset.lane;
        if (lane === 'rooms' && d.b.kind === 'clean' && d.b.area !== key) {
          const n = fillWithArea(d.b, key);
          toast(n ? `${d.b.staff} 改到 ${areaName(key)}：已帶入今天 ${n} 間房，請在下方刪掉不需要的` : `${areaName(key)} 今天沒有要清的房間`);
        }
        d.b.area = key;
        if (lane === 'outdoor' && d.b.kind === 'clean' && !(d.b.rooms || []).length) { d.b.kind = 'task'; d.b.tasks = []; d.b.label = taskLabel(d.b); }
        if (lane === 'rooms' && d.b.kind === 'task') { d.b.kind = 'clean'; d.b.tasks = []; delete d.b.label; d.b.rooms = []; d.b.parts = []; }
      }
    }
  }
  P.edited = true; selId = d.b.id; changed();
}
$('boardInner').addEventListener('pointerup', e => endDrag(e, false));
$('boardInner').addEventListener('click', e => {
  if (e.target.closest('.bar')) return;
  const track = e.target.closest('.gtrack'); if (!track) return;
  const g = track.closest('.group'); const key = g.dataset.group;
  if (view === 'area' && g.dataset.lane !== 'outdoor') return;
  const x = e.clientX - track.getBoundingClientRect().left;
  const start = Math.max(geo.d0, Math.floor((geo.d0 + x / geo.ppm) / 15) * 15);
  const dur = 60;
  const free = sd => { const st = T(sd.start), en = T(sd.end); return start >= st && start < en && !P.blocks.some(b => b.staff === sd.name && b.start < start + dur && b.start + b.dur > start); };
  let staff, area;
  if (view === 'staff') {
    staff = key; const sd = P.staffDay.find(s => s.name === key); const cfg = S.staff.find(s => s.name === key) || {};
    area = (sd && sd.ded) || (cfg.prefs || [])[0] || S.areas[0].id;
  } else {
    area = key;
    const on = P.staffDay.filter(s => s.on);
    const pref = n => ((S.staff.find(s => s.name === n) || {}).prefs || []).includes(area);
    const overlap = sd => P.blocks.filter(b => b.staff === sd.name).reduce((m, b) => m + Math.max(0, Math.min(b.start + b.dur, start + dur) - Math.max(b.start, start)), 0);
    const covers = sd => start >= T(sd.start) && start < T(sd.end);
    const busyLeast = on.filter(covers).sort((a, b) => overlap(a) - overlap(b))[0];
    const pick = on.find(s => free(s) && (s.ded === area)) || on.find(s => free(s) && pref(s.name)) || on.find(free) || busyLeast || on[0] || { name: S.staff[0]?.name || '' };
    staff = pick.name;
  }
  const b = { id: 'b' + (P.nextId++), kind: 'task', staff, area, start, dur, rooms: [], parts: [], tasks: [], label: 'Outdoor work' };
  P.blocks.push(b); P.edited = true; selId = b.id; changed();
  $('editor').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  toast(`已新增 ${staff} ${fmt(start)} 的屋外・屋上工作，請在下方勾選內容`);
});
$('boardInner').addEventListener('pointercancel', e => endDrag(e, true));
$('boardInner').addEventListener('keydown', e => {

});

/* editor */
$('editor').addEventListener('click', e => {
  const b = P.blocks.find(x => x.id === selId); if (!b) return;
  if (e.target.id === 'edClose') { selId = null; renderBoard(); renderEditor(); return; }
  if (e.target.id === 'edDel') { P.blocks = P.blocks.filter(x => x !== b); selId = null; P.edited = true; changed(); return; }
  if (e.target.id === 'edSplit') {
    const h = Math.round(b.dur / 2 / 5) * 5; const c = clone(b); c.id = 'b' + (P.nextId++); c.start = b.start + h; c.dur = b.dur - h; b.dur = h;
    P.blocks.push(c); P.edited = true; changed(); toast('已切成兩段，可以把其中一段改給別人'); return;
  }
  if (e.target.id === 'edDup') { const c = clone(b); c.id = 'b' + (P.nextId++); P.blocks.push(c); selId = c.id; P.edited = true; changed(); return; }
  const kc = e.target.closest('[data-edkind]');
  if (kc && kc.dataset.edkind !== b.kind) {
    if (kc.dataset.edkind === 'task') {
      if ((b.rooms || []).length) toast(`已移除這段的房間（${b.rooms.join('、')}），請確認它們有人負責`);
      b.kind = 'task'; b.rooms = []; b.parts = []; b.tasks = b.tasks || []; b.label = taskLabel(b);
    } else { b.kind = 'clean'; b.tasks = []; delete b.label; b.rooms = b.rooms || []; b.parts = b.parts || []; }
    P.edited = true; changed(); return;
  }
  if (kc) return;
  const tc = e.target.closest('[data-edtask]');
  if (tc) { const x = tc.dataset.edtask; b.tasks = b.tasks || []; b.tasks = b.tasks.includes(x) ? b.tasks.filter(y => y !== x) : [...b.tasks, x]; b.label = taskLabel(b); P.edited = true; changed(); return; }
  if (e.target.id === 'edTaskAdd') { addCustomTask(b); return; }
  const rc = e.target.closest('[data-edroom]');
  if (rc) {
    const r = rc.dataset.edroom; b.rooms = b.rooms || [];
    if (b.rooms.includes(r)) b.rooms = b.rooms.filter(x => x !== r);
    else {
      b.rooms.push(r);
      const room = S.rooms.find(x => x.name === r); if (room && b.rooms.length === 1) b.area = room.area;
    }
    fitBlock(b);
    P.edited = true; changed();
  }
});
/* A room's share of work for this slot: split evenly with anyone else also cleaning it */
function roomShare(b, room) {
  const it = items().items.find(i => i.room === room); if (!it) return 30;
  const others = new Set(P.blocks.filter(x => x !== b && x.kind === 'clean' && (x.rooms || []).includes(room)).map(x => x.staff));
  others.delete(b.staff);
  return Math.ceil(itemMinutes(it, S) / (1 + others.size) / 5) * 5;
}
/* Length of a cleaning slot follows its rooms */
function fitBlock(b) {
  b.parts = (b.rooms || []).map(r => ({ room: r, team: 1, dur: roomShare(b, r) }));
  b.dur = Math.max(15, b.parts.reduce((a, p) => a + p.dur, 0));
}
/* Moved to another area: take all of that area's rooms today (PR first), to be trimmed by hand */
function fillWithArea(b, area) {
  const its = items().items.filter(i => !i.skip && i.area === area);
  its.sort((x, y) => (y.pr - x.pr) || ((roomDeadline(x, S) ?? 9999) - (roomDeadline(y, S) ?? 9999)));
  b.area = area; b.rooms = its.map(i => i.room); fitBlock(b);
  return its.length;
}
function taskLabel(b) { return (b.tasks || []).length ? b.tasks.join(' / ') : 'Outdoor work'; }
function addCustomTask(b) {
  const inp = $('edTaskNew'); const v = (inp && inp.value || '').trim(); if (!v) return;
  b.tasks = [...(b.tasks || []).filter(x => x !== v), v]; b.label = taskLabel(b); P.edited = true; changed();
  setTimeout(() => $('edTaskNew')?.focus(), 0);
}
$('editor').addEventListener('keydown', e => {
  if (e.target.id === 'edTaskNew' && e.key === 'Enter') { e.preventDefault(); const b = P.blocks.find(x => x.id === selId); if (b) addCustomTask(b); }
});
$('editor').addEventListener('change', e => {
  const b = P.blocks.find(x => x.id === selId); if (!b) return;
  const t = e.target;
  if (t.id === 'edTaskNew') return;
  if (t.id === 'edStaff') b.staff = t.value;
  if (t.id === 'edArea') {
    if (b.kind === 'clean' && b.area !== t.value) { const n = fillWithArea(b, t.value); toast(n ? `已帶入 ${areaName(t.value)} 今天 ${n} 間房，請刪掉不需要的` : `${areaName(t.value)} 今天沒有要清的房間`); }
    else b.area = t.value;
  }
  if (t.id === 'edLabel') b.label = t.value;
  if (t.id === 'edStart' && t.value) { const end = b.start + b.dur; b.start = T(t.value); b.dur = Math.max(10, end - b.start); }
  if (t.id === 'edEnd' && t.value) b.dur = Math.max(10, T(t.value) - b.start);
  P.edited = true; changed();
});
$('issues').addEventListener('click', e => {
  const el = e.target.closest('[data-issue]'); if (!el) return;
  const i = $('issues')._issues[+el.dataset.issue]; if (!i || !i.ids.length) return;
  selId = i.ids[0]; renderBoard(); renderEditor();
  document.querySelector(`.bar[data-id="${selId}"]`)?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
});
$('messages').addEventListener('click', e => {
  const b = e.target.closest('[data-msgcopy]'); if (!b) return;
  const pre = $('msg-' + b.dataset.msgcopy); const txt = pre.textContent;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('已選取文字，請按複製'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('已複製'), fallback); } catch (err) { fallback(); }
});
$('checklists').addEventListener('click', e => {
  const b = e.target.closest('[data-clcopy]'); if (!b) return;
  const pre = $('cl-' + b.dataset.clcopy); const txt = pre.textContent;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('已選取文字，請按複製'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('已複製'), fallback); } catch (err) { fallback(); }
});
$('copy').onclick = () => {
  const txt = $('share').textContent;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('share')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('已選取文字，請按複製'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('已複製'), fallback); } catch (err) { fallback(); }
};

/* settings events */
$('view-set').addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  const num = v => Math.max(0, +v || 0);
  if (d.rname != null) S.rooms[+d.rname].name = t.value.trim();
  else if (d.rarea != null) S.rooms[+d.rarea].area = t.value;
  else if (d.rbase != null) S.rooms[+d.rbase].base = num(t.value);
  else if (d.rper != null) S.rooms[+d.rper].perGuest = num(t.value);
  else if (d.sname != null) { const old = S.staff[+d.sname].name, nw = t.value.trim(); S.staff[+d.sname].name = nw; P.staffDay.forEach(s => { if (s.name === old) s.name = nw; }); P.blocks.forEach(b => { if (b.staff === old) b.staff = nw; }); S.fixed.forEach(f => { if (f.staff === old) f.staff = nw; }); savePlan(); }
  else if (d.srole != null) { S.staff[+d.srole].role = t.value; syncStaffDay(); }
  else if (d.sstart != null) S.staff[+d.sstart].start = fmt(T(t.value));
  else if (d.send != null) S.staff[+d.send].end = fmt(T(t.value));
  else if (d.fon != null) S.fixed[+d.fon].on = t.checked;
  else if (d.flabel != null) S.fixed[+d.flabel].label = t.value;
  else if (d.farea != null) S.fixed[+d.farea].area = t.value;
  else if (d.fstaff != null) S.fixed[+d.fstaff].staff = t.value;
  else if (d.fstart != null) S.fixed[+d.fstart].start = fmt(T(t.value));
  else if (d.fdur != null) S.fixed[+d.fdur].dur = num(t.value);
  else if (d.rulelist != null) S.rules[d.rulelist] = t.value.split(/[,，、\s]+/).filter(x => /^\d{1,2}[:：]\d{2}$/.test(x)).map(x => fmt(T(x.replace('：', ':'))));
  else if (d.rule != null) S.rules[d.rule] = t.tagName === 'SELECT' ? fmt(T(t.value)) : num(t.value);
  else if (d.aname != null) S.areas[+d.aname].name = t.value.trim();
  else if (d.aja != null) S.areas[+d.aja].ja = t.value.trim();
  else if (d.acheck != null) { S.checkItemsJa = S.checkItemsJa || {}; S.checkItemsJa[d.acheck] = t.value.split(/[、,，\n]/).map(x => x.trim()).filter(Boolean); }
  else if (d.sja != null) S.staff[+d.sja].ja = t.value.trim();
  else if (d.slang != null) S.staff[+d.slang].lang = t.value;
  else if (d.rt != null) {
    const [a, k, f] = d.rt.split(':'); const r = S.routines[a][+k];
    if (f === 'time') r.time = t.value ? fmt(T(t.value)) : '';
    else if (f === 'dur') r.dur = num(t.value);
    else if (f === 'title') r.title = t.value.trim();
    else if (f === 'details') r.details = t.value.split('\n').map(x => x.trim()).filter(Boolean);
    const rt = routineFor(a).slice().sort((x, y) => (x.time ? T(x.time) : 9999) - (y.time ? T(y.time) : 9999));
    S.routines[a] = rt;
  }
  else if (d.outdoor != null) { S.outdoor = S.outdoor || {}; S.outdoor[d.outdoor] = t.value.split('\n').map(x => x.trim()).filter(Boolean); }
  else if (d.msg != null) { S.messages = S.messages || {}; S.messages[d.msg] = t.value; }
  else if (t.id === 'attn') S.attention = t.value.split('\n').map(x => x.trim()).filter(Boolean);
  else return;
  saveSettings(); renderSettings();
});
$('view-set').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.rtadd != null) { S.routines = S.routines || {}; (S.routines[d.rtadd] = S.routines[d.rtadd] || []).push({ id: 'r' + Date.now().toString(36), time: '12:00', dur: 30, title: 'New task', details: [] }); }
  else if (d.rtdel != null) { const [a, k] = d.rtdel.split(':'); S.routines[a].splice(+k, 1); }
  else if (t.id === 'addRoom') S.rooms.push({ name: '新房間', area: S.areas[0].id, base: 30, perGuest: 30 });
  else if (t.id === 'addStaff') { S.staff.push({ name: '新員工', start: '10:00', end: '16:00', prefs: [], color: S.staff.length % COLORS.length }); syncStaffDay(); savePlan(); }
  else if (t.id === 'addFixed') S.fixed.push({ label: '檢查', area: S.areas[0].id, start: '14:00', dur: 30, staff: S.staff[0]?.name || '', on: true });
  else if (t.id === 'addArea') S.areas.push({ id: 'a' + Date.now().toString(36), name: '新區域' });
  else if (d.rdel != null) S.rooms.splice(+d.rdel, 1);
  else if (d.sdel != null) { S.staff.splice(+d.sdel, 1); syncStaffDay(); savePlan(); }
  else if (d.fdel != null) S.fixed.splice(+d.fdel, 1);
  else if (d.scol != null) { const [i, k] = d.scol.split(':').map(Number); S.staff[i].color = k; }
  else if (d.sstartarea != null) { const [i, a] = d.sstartarea.split(':'); const p = S.staff[+i].startAreas || []; S.staff[+i].startAreas = p.includes(a) ? p.filter(x => x !== a) : [...p, a]; }
  else if (d.spref != null) { const [i, a] = d.spref.split(':'); const p = S.staff[+i].prefs; S.staff[+i].prefs = p.includes(a) ? p.filter(x => x !== a) : [...p, a]; }
  else if (t.id === 'resetSet') { $('resetBox').innerHTML = `<span class="confirm">確定恢復預設？房間、員工、規則都會回到初始值。<button class="btn sm primary" id="resetYes">恢復</button><button class="btn sm" id="resetNo">取消</button></span>`; return; }
  else if (t.id === 'resetYes') { S = clone(DEFAULT_SETTINGS); syncStaffDay(); savePlan(); }
  else if (t.id === 'resetNo') { renderSettings(); return; }
  else return;
  saveSettings(); renderSettings();
});

/* tabs & dates */
function showTab(which) {
  $('tab-plan').setAttribute('aria-selected', which === 'plan'); $('tab-set').setAttribute('aria-selected', which === 'set');
  $('view-plan').hidden = which !== 'plan'; $('view-set').hidden = which !== 'set';
  if (which === 'set') renderSettings(); else renderAll();
}
$('tab-plan').onclick = () => showTab('plan');
$('tab-set').onclick = () => showTab('set');
async function openDate(date) {
  if (!date) return;
  const saved = await store.get('plans/' + date);
  if (saved) { P = saved; P.overrides = P.overrides || {}; P.blocks = P.blocks || []; }
  else P = newPlan(date);
  selId = null; syncStaffDay(); renderAll();
}
$('date').addEventListener('change', e => openDate(e.target.value));
$('prevDay').onclick = () => openDate(shiftDate(P.date, -1));
$('nextDay').onclick = () => openDate(shiftDate(P.date, 1));
$('today').onclick = () => openDate(todayStr());
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderBoard, 120); });

/* ---------- boot ---------- */
(async function boot() {
  // first frame: today, empty until the DCL is pasted
  P = newPlan(todayStr());
  if (!store.gate) { setSync('loading'); renderAll(); }
  await store.init();
  // Matrix DCL version: only the admin may see or use the planner
  if (store.gate && store.mode !== 'sb') {
    const why = store.tableMissing ? `Supabase 還沒有 planner_store 表，請先執行 teamdcl_planner.sql。<br><small class="hint">${esc(store.tableErr || '')}</small>`
      : store.email ? `${esc(store.email)} 不是管理者帳號，無法使用排班。`
      : '請先登入 Matrix DCL（管理者帳號）。';
    $('app').innerHTML = `<div class="panel" style="max-width:520px;margin:40px auto"><h2>🔒 排班</h2><p>${why}</p><p><a href="./">回到 Matrix DCL</a></p></div>`;
    document.body.classList.add('ready');
    return;
  }
  document.body.classList.add('ready');
  if (typeof loadRoster === 'function') loadRoster();
  const savedS = await store.get('app/settings');
  if (savedS && savedS.rooms) {
    S = Object.assign(clone(DEFAULT_SETTINGS), savedS, { rules: Object.assign(clone(DEFAULT_SETTINGS.rules), savedS.rules || {}) });
    if ((savedS.version || 1) < 2) { // v2: new Glamping rooms, area routines, evening block replaced by routine
      for (const r of DEFAULT_SETTINGS.rooms) if (!S.rooms.some(x => x.name.toLowerCase() === r.name.toLowerCase())) S.rooms.push(clone(r));
      S.routines = Object.assign(clone(DEFAULT_SETTINGS.routines), savedS.routines || {});
      S.fixed = S.fixed.filter(f => f.label !== '傍晚作業');
      S.version = 2; saveSettings();
    }
    if ((S.version || 1) < 3) { // v3: daily copyable message per area, evening tidy from 16:30
      S.messages = Object.assign(clone(DEFAULT_SETTINGS.messages), savedS.messages || {});
      const g5 = ((S.routines || {}).glamping || []).find(r => r.id === 'g5');
      if (g5 && g5.time === '17:00') { g5.time = '16:30'; g5.dur = 75; }
      S.version = 3; saveSettings();
    }
    if ((S.version || 1) < 4) { // v4: Momo room
      for (const r of DEFAULT_SETTINGS.rooms) if (!S.rooms.some(x => x.name.toLowerCase() === r.name.toLowerCase())) S.rooms.push(clone(r));
      S.version = 4; saveSettings();
    }
    if ((S.version || 1) < 6) {
      for (const a of DEFAULT_SETTINGS.areas) if (!S.areas.some(x => x.id === a.id)) S.areas.push(clone(a));
      S.outdoor = Object.assign(clone(DEFAULT_SETTINGS.outdoor), S.outdoor || {}, savedS.outdoor || {});
      if (!S.outdoor.gekkouen) S.outdoor.gekkouen = clone(DEFAULT_SETTINGS.outdoor.gekkouen);
    }
    if ((S.version || 1) < 5) { S.outdoor = Object.assign(clone(DEFAULT_SETTINGS.outdoor), savedS.outdoor || {}); S.version = 5; saveSettings(); }
    if ((S.version || 1) < 6) { S.version = 6; saveSettings(); }
    if ((S.version || 1) < 8) { // v8: Noa, 月江苑, Grand Villa aliases (runs after older steps below via version check order)
      for (const r of DEFAULT_SETTINGS.rooms) {
        const x = S.rooms.find(y => y.name.toLowerCase() === r.name.toLowerCase());
        if (!x) S.rooms.push(clone(r)); else if (r.aliases && !x.aliases) x.aliases = clone(r.aliases);
      }
    }
    if ((S.version || 1) < 7) { // v7: each person's role and usual starting area
      for (const d of DEFAULT_SETTINGS.staff) {
        const x = S.staff.find(s => s.name.toLowerCase() === d.name.toLowerCase());
        if (x) { x.prefs = clone(d.prefs); x.startAreas = clone(d.startAreas); x.role = d.role; if (d.name === 'Kayo') x.start = d.start; }
        else S.staff.push(clone(d));
      }
      S.staff.forEach(s => { s.role = s.role || 'clean'; s.startAreas = s.startAreas || []; });
      S.version = 7; saveSettings();
    }
    if ((S.version || 1) < 8) { S.version = 8; saveSettings(); }
    if ((S.version || 1) < 9) { // v9: Japanese names and Kayo's Japanese check list
      for (const a of DEFAULT_SETTINGS.areas) { const x = S.areas.find(y => y.id === a.id); if (x && !x.ja) x.ja = a.ja; }
      for (const d of DEFAULT_SETTINGS.staff) { const x = S.staff.find(y => y.name.toLowerCase() === d.name.toLowerCase()); if (x) { if (!x.ja) x.ja = d.ja; if (!x.lang) x.lang = d.lang; } }
      if (!S.checkItemsJa) S.checkItemsJa = clone(DEFAULT_SETTINGS.checkItemsJa);
      S.version = 9; saveSettings();
    }
  }
  const dates = (await store.listPlans()).sort();
  dates.forEach(d => knownDates.add(d));
  const t = todayStr();
  await openDate(t);   // always start on today: an empty page if nothing is planned yet (no example)
  setSync(store.mode === 'local' ? 'local' : 'saved');
})();

</script>
